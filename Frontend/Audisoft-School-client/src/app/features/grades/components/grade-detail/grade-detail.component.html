<app-modal
  [title]="'Detalle de la Nota'"
  [isOpen]="!!grade"
  [size]="'md'"
  (close)="grade = null"
>
  @if (grade) {
    <dl class="row mb-0">
      <dt class="col-sm-3 text-muted">ID</dt>
      <dd class="col-sm-9">{{ grade.id }}</dd>

      <dt class="col-sm-3 text-muted">Asignatura</dt>
      <dd class="col-sm-9 fw-medium">{{ grade.nombre }}</dd>

      <dt class="col-sm-3 text-muted">Valor</dt>
      <dd class="col-sm-9">{{ grade.valor | number:'1.2-2' }}</dd>

      <dt class="col-sm-3 text-muted">Estudiante</dt>
      <dd class="col-sm-9">{{ grade.estudiante?.nombre || 'Desconocido' }}</dd>

      <dt class="col-sm-3 text-muted">Profesor</dt>
      <dd class="col-sm-9">{{ grade.profesor?.nombre || 'Desconocido' }}</dd>
    </dl>

    <div class="d-flex justify-content-end mt-4">
      <app-button
        variant="outline-secondary"
        type="button"
        (click)="grade = null"
      >
        Cerrar
      </app-button>
    </div>
  }
</app-modal>
