<div class="page-header">
  <div class="header-content">
    <div class="header-titles">
      <h1 class="page-title">{{ title }}</h1>
      @if (subtitle) {
        <p class="page-subtitle">{{ subtitle }}</p>
      }
    </div>
    @if (showCreateButton) {
      <div class="header-actions">
        <app-button
          variant="primary"
          size="md"
          [icon]="createButtonIcon"
          (click)="onCreate()"
        >
          {{ createButtonText }}
        </app-button>
      </div>
    }
  </div>
</div>
